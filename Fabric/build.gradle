plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

// Definimos el nombre base global
base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    mavenCentral()
    maven { url = "https://maven.architectury.dev/" }
    maven { url = "https://cursemaven.com" }

    flatDir {
        dirs 'libs'
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "tinyfarmbossaddon" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Librerías locales (formato completo con group para evitar warnings de Gradle)
    modImplementation group: 'local', name: 'tinymobfarm-remastered', version: '1.4.1', ext: 'jar'
    modImplementation group: 'local', name: 'architectury-api', version: '9.2.14', ext: 'jar'
    modImplementation group: 'local', name: 'supermartijn642configlib', version: '1.1.8a', ext: 'jar'
    modImplementation group: 'local', name: 'uilib', version: '0.3.6', ext: 'jar'
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.encoding = "UTF-8"
}

// CONFIGURACIÓN DE NOMBRES (Aquí está la magia)

// 1. Tarea de jar básica (el archivo "crudo")
jar {
    archiveClassifier = "dev"
}

// 2. Tarea de remapJar (el archivo FINAL que va a la carpeta mods)
remapJar {
    archiveFileName = "${project.archives_base_name}-${project.version}-Fabric.jar"
}