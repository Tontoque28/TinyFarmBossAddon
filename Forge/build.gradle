buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        // MixinGradle: conecta el Annotation Processor de Mixin con los mapeos SRG que
        // genera ForgeGradle (incluso usando mapeos "official"), y genera el refmap
        // correctamente. Sin esto, "-AreobfSrgFile" y compañía no se resuelven bien a mano.
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.24'
}

apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id} Forge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

mixin {
    add sourceSets.main, "tinyfarmbossaddon.refmap.json"
    config "tinyfarmbossaddon.mixins.json"
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        client {
            // Define explícitamente la tarea runClient
            workingDirectory project.file('run')
            // AÑADE ESTA LÍNEA AQUÍ:
            arg "-mixin.config=tinyfarmbossaddon.mixins.json"

            mods {
                tinyfarmbossaddon {
                    source sourceSets.main
                }
            }
        }
        server {
            // Define explícitamente la tarea runServer
            workingDirectory project.file('run')
            // AÑADE ESTA LÍNEA AQUÍ TAMBIÉN:
            arg "-mixin.config=tinyfarmbossaddon.mixins.json"

            mods {
                tinyfarmbossaddon {
                    source sourceSets.main
                }
            }
        }
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url "https://maven.architectury.dev/" }
    flatDir { dir 'libs' }
    maven { url "https://repo.spongepowered.org/repository/maven-public/" }
    maven {
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("dev.architectury:architectury-forge:9.2.14")

    // Registra el Annotation Processor de Mixin: sin esto, "tinyfarmbossaddon.refmap.json"
    // nunca se genera durante la compilación y los @Inject fallan en producción con
    // "No refMap loaded" (aunque en el entorno de desarrollo de Gradle no se note el problema).
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    implementation fg.deobf("local:tinymobfarm:1.4.1-1.20.1-forge")
    implementation fg.deobf("local:supermartijn642configlib:1.1.8-forge-mc1.20")
    implementation fg.deobf("local:uilib:0.3.6-forge")


    // Citadel se queda mediante Maven porque sí funciona:
    implementation fg.deobf("curse.maven:citadel-331936:7476570")

    // Ice and Fire configurado correctamente mediante flatDir local
    implementation fg.deobf(group: 'local', name: 'iceandfire', version: '2.1.13-1.20.1-beta-5')

}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest.attributes([
            'Specification-Title': mod_id,
            'Specification-Vendor': mod_authors,
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor': mod_authors,
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            'MixinConfigs': 'tinyfarmbossaddon.mixins.json'
    ])
}