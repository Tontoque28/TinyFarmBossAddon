plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = ''
base { archivesName = "TinyFarmBossAddon-${project.mod_version}-Fabric-${project.minecraft_version}" }
group = project.maven_group

repositories {
	mavenCentral()
}

loom {
	runs {
		server {
			property "oshi.os.windows.hkeyperfdata", "false"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	modImplementation files('libs/tinymobfarm-remastered.jar')
	modImplementation files('libs/architectury-api.jar')
	modImplementation files('libs/supermartijn642configlib.jar')
	modImplementation files('libs/uilib.jar')
	if (System.getenv('TFB_CON_ICEANDFIRE') == 'true') {
		modImplementation files('libs/IceAndFireCE-1.2.7-1.20.1-fabric.jar')
		modImplementation files('libs/jupiter-2.3.7-1.20.1-fabric.jar')
		modImplementation files('libs/uranus-2.2.6-1.20.1-fabric.jar')
		modImplementation files('libs/cardinal-components-api-5.2.3.jar')
		modImplementation files('libs/cardinal-components-base-5.2.3.jar')
		modImplementation files('libs/cardinal-components-entity-5.2.3.jar')
	}
}

processResources {
	inputs.property "version", project.mod_version

	filesMatching("fabric.mod.json") {
		expand "version": project.mod_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	inputs.property "projectName", project.name

	from("LICENSE") {
		rename { "${it}_${project.name}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
